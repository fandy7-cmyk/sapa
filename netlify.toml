[build]
  publish = "public"
  functions = "netlify/functions"

# ── Cache headers ─────────────────────────────────────────────
# landing.html & app.html: selalu fresh
[[headers]]
  for = "/landing.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# index.html: selalu fresh (SPA entry point, tidak boleh di-cache)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# version.json: selalu fresh (dipakai buat cek update)
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# JS & CSS: cache agresif (sudah ada versioning ?v=xxx di URL)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── API sub-path → functions (spesifik dulu, urutan penting!) ─
[[redirects]]
  from = "/api/surat-masuk/*"
  to = "/.netlify/functions/surat-masuk/:splat"
  status = 200
  force = true

