# ── /:slug → function redirect (bundle ATAU shortlink) ────────
[[redirects]]
  from = "/:slug"
  to = "/.netlify/functions/redirect/:slug"
  status = 200

# ── Fallback → app.html (SPA) ────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

[functions]
  node_bundler = "esbuild"