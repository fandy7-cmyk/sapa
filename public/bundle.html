<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <script>
  // Bundle page cuma mau efek partikel tema di header (kayak topbar di
  // landing/app), bukan pill/banner mengambang atau background penuh -
  // theme-engine.js cek flag ini duluan sebelum render pill/banner.
  window.SAPA_TEMA_PARTIKEL_ONLY = true;
  </script>
  <script>
  // Prefetch tema musiman sedini mungkin - lihat komentar sama di
  // landing.html/login.html soal cache localStorage.
  (function () {
    var CACHE_KEY = 'sapa_tema_cache_v1';
    var CACHE_TTL = 6 * 60 * 60 * 1000; // 6 jam

    function preloadGambar(theme) {
      if (theme && theme.gambar_url) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = theme.gambar_url;
        document.head.appendChild(link);
      }
    }

    function bacaCache() {
      try {
        var raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        if (!parsed || !parsed.ts || (Date.now() - parsed.ts) > CACHE_TTL) return null;
        return parsed.data;
      } catch (e) { return null; }
    }

    function tulisCache(data) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: data })); } catch (e) {}
    }

    var freshPromise = fetch('/api/landing/tema-aktif?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : { theme: null }; })
      .then(function (d) {
        tulisCache(d);
        preloadGambar(d && d.theme);
        return d;
      })
      .catch(function (e) {
        console.warn('[theme-engine] prefetch awal gagal:', e);
        return { theme: null };
      });

    var cached = bacaCache();
    if (cached) {
      preloadGambar(cached.theme);
      window.__sapaTemaPromise = Promise.resolve(cached);
    } else {
      window.__sapaTemaPromise = freshPromise;
    }
  })();
  </script>

  <style>
    
    .item-icon svg, .state-icon svg, .item-arrow svg {

    .bf-icon-wrap {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      margin-bottom: 10px;
      animation: bfIconLoop 6s cubic-bezier(0.34,1.56,0.64,1) infinite;
    }
    .bf-icon-wrap img {
      width: 32px; height: 32px; object-fit: contain;
      position: relative; z-index: 2;
    }
    .bf-ring-spin {
      position: absolute; inset: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, rgba(20,184,166,.7) 14%, rgba(45,212,191,.9) 22%, transparent 34%, transparent 55%, rgba(13,148,136,.6) 68%, rgba(45,212,191,.8) 76%, transparent 88%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
      animation: bfRingSpin 2.6s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    .bf-particles-mini { position: absolute; inset: -14px; pointer-events: none; z-index: 1; }
    .bfp {
      position: absolute; top: 50%; left: 50%;
      border-radius: 50%;
      transform-origin: 0 0;
      animation: bfOrbit linear infinite, bfTwinkle ease-in-out infinite;
    }
    .bfp-1 { --r: 17px; width: 1.5px; height: 1.5px; background: #2dd4bf; box-shadow: 0 0 3px 1px rgba(45,212,191,.8); animation-duration: 4.6s, 1.9s; animation-delay: -1.6s, -.4s; }
    .bfp-2 { --r: 22px; width: 2px;   height: 2px;   background: #0d9488; box-shadow: 0 0 3px 1px rgba(13,148,136,.7); animation-duration: 5.5s, 2.3s; animation-delay: -2.3s, -.6s; }
    .bfp-3 { --r: 14px; width: 1.5px; height: 1.5px; background: #fff; box-shadow: 0 0 3px 1px rgba(255,255,255,.85); animation-duration: 3.9s, 1.6s; animation-delay: -1.1s, -.3s; }
    .bfp-4 { --r: 25px; width: 1.5px; height: 1.5px; background: #5eead4; box-shadow: 0 0 3px 1px rgba(94,234,212,.7); animation-duration: 6.2s, 2.6s; animation-delay: -2.8s, -.7s; }
    .bfp-5 { --r: 19px; width: 2px;   height: 2px;   background: #14b8a6; box-shadow: 0 0 3px 1px rgba(20,184,166,.75); animation-duration: 4.9s, 2.1s; animation-delay: -1.9s, -.5s; }

    @keyframes bfRingSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes bfOrbit {
      from { transform: rotate(0deg)   translateX(var(--r, 20px)) rotate(0deg); }
      to   { transform: rotate(360deg) translateX(var(--r, 20px)) rotate(-360deg); }
    }
    @keyframes bfTwinkle {
      0%, 100% { opacity: .25; }
      50%      { opacity: 1; }
    }
    
    @keyframes bfIconLoop {
      0%   { opacity: 0; transform: scale(0.6); filter: drop-shadow(0 0 0px rgba(13,148,136,0)); }
      12%  { opacity: 1; transform: scale(1.12); filter: drop-shadow(0 4px 10px rgba(0,0,0,.15)) drop-shadow(0 0 12px rgba(13,148,136,.5)); }
      18%  { transform: scale(1); }
      50%  { filter: drop-shadow(0 2px 8px rgba(0,0,0,.12)) drop-shadow(0 0 8px rgba(13,148,136,.35)); }
      82%  { opacity: 1; transform: scale(1); }
      92%  { opacity: 0; transform: scale(0.75); }
      100% { opacity: 0; transform: scale(0.6); }
    }
  </style>

<script>

function esc(str) {
  return String(str||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, type='success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.animation='toastOut .3s ease forwards'; setTimeout(()=>t.remove(),300); }, 2500);
}

const Icons = {
  
  fileX: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m10 14 4 4"/><path d="m14 14-4 4"/></svg>`,
  
  triangleAlert: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`,
  
  inbox: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,
  
  link: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
  
  arrowRight: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`,
  
  serverCrash: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/><path d="M12 6h6"/><path d="M12 18h6"/></svg>`,
  
  alertCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
};

function getItemIcon(ikonRaw) {
  
  
  if (ikonRaw && ikonRaw.includes("<svg")) return ikonRaw;
  return Icons.link;
}

function getArrowIcon() {
  return Icons.arrowRight;
}

const _params = new URLSearchParams(location.search);
const _pathSlug = location.pathname.split('/').filter(Boolean)[0] || '';
const slug = _params.get('slug') || _pathSlug;

const _viaQr = _params.get('src') === 'qr';
const IconLock = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;

if (!slug) {
  document.getElementById('headerContent').innerHTML = `
    <div class="state-box">
      <div class="state-icon">${Icons.fileX}</div>
      <h2>Bundle tidak ditemukan</h2>
      <p>Alamat bundle tidak valid.</p>
    </div>`;
  document.getElementById('itemsContainer').innerHTML = '';
} else {
  loadBundle(slug);
}

function renderBundlePasswordPrompt(slug, wrong) {
  document.getElementById('headerContent').innerHTML = `
    <div class="state-box">
      <div class="state-icon">${IconLock}</div>
      <h2>Bundle Diproteksi</h2>
      <p>Masukkan password untuk membuka bundle ini.</p>
    </div>`;
  document.getElementById('itemsContainer').innerHTML = `
    <form id="bundlePwForm" style="max-width:320px;margin:0 auto;display:flex;flex-direction:column;gap:10px">
      ${wrong ? '<div style="color:#ef4444;font-size:.78rem">Password salah, coba lagi.</div>' : ''}
      <input type="password" id="bundlePwInput" placeholder="Password" required autofocus
        style="border:1.5px solid ${wrong ? '#fca5a5' : '#e2e8f0'};border-radius:10px;padding:11px 14px;font-size:.88rem;font-family:inherit;outline:none" />
      <button type="submit" style="background:#0f766e;color:#fff;border:none;border-radius:10px;padding:12px;font-size:.88rem;font-weight:600;font-family:inherit;cursor:pointer">Buka Bundle</button>
    </form>`;
  document.getElementById('bundlePwForm').addEventListener('submit', function (e) {
    e.preventDefault();
    loadBundle(slug, document.getElementById('bundlePwInput').value);
  });
}

async function loadBundle(slug, pw) {
  try {
    const qs = new URLSearchParams();
    if (pw) qs.set('pw', pw);
    if (_viaQr) qs.set('src', 'qr');
    const qsStr = qs.toString();
    const r = await fetch(`/api/bundles/${slug}${qsStr ? '?' + qsStr : ''}`);
    if (r.status === 401) {
      const dj = await r.json().catch(() => ({}));
      renderBundlePasswordPrompt(slug, !!dj.wrong);
      return;
    }
    if (!r.ok) {
      const dj = await r.json().catch(() => ({}));
      const reason = dj.reason || (r.status === 403 ? 'inactive' : 'not_found');
      const isInactive = reason === 'inactive';
      const isExpired = reason === 'expired';
      document.getElementById('headerContent').innerHTML = `
        <div class="state-box">
          <div class="state-icon">
            ${(isInactive || isExpired) ? Icons.triangleAlert : Icons.fileX}
          </div>
          <h2>${isExpired ? 'Bundle Kedaluwarsa' : isInactive ? 'Bundle Tidak Tersedia' : 'Bundle Tidak Ditemukan'}</h2>
          <p>${isExpired
            ? 'Bundle ini sudah melewati masa berlakunya dan tidak dapat diakses lagi.'
            : isInactive
            ? 'Bundle link ini sedang dinonaktifkan dan tidak dapat diakses saat ini.'
            : 'Link bundle mungkin sudah tidak aktif atau alamatnya salah.'
          }</p>
        </div>`;
      document.getElementById('itemsContainer').innerHTML = '';
      return;
    }
    const { bundle, items } = await r.json();

    // Update page title
    document.title = `SAPA Perencanaan`;

    // Render header
    document.getElementById('headerContent').innerHTML = `
      <div class="bundle-brand-name">${esc(bundle.judul)}</div>
      ${bundle.deskripsi ? `<div class="bundle-brand-sub">${esc(bundle.deskripsi)}</div>` : ''}`;

    
    if (!items.length) {
      document.getElementById('itemsContainer').innerHTML = `
        <div class="state-box">
          <div class="state-icon">${Icons.inbox}</div>
          <h2>Bundle masih kosong</h2>
          <p>Belum ada link yang ditambahkan ke bundle ini.</p>
        </div>`;
      return;
    }

    document.getElementById('itemsContainer').innerHTML = `
      <div class="items-list">
        ${items.map((item, i) => {
          const iconHtml = getItemIcon(item.ikon);
          const arrowHtml = getArrowIcon();
          return `
          <a class="item-card" href="${esc(item.url)}" target="_blank" rel="noopener"
             style="animation-delay:${i * 0.05}s">
            <div class="item-icon">${iconHtml}</div>
            <div class="item-body">
              <div class="item-title">${esc(item.judul)}</div>
              ${item.deskripsi ? `<div class="item-desc">${esc(item.deskripsi)}</div>` : ''}
            </div>
            <div class="item-arrow">${arrowHtml}</div>
          </a>`;
        }).join('')}
      </div>`;

  } catch (err) {
    console.error(err);
    document.getElementById('headerContent').innerHTML = `
      <div class="state-box">
        <div class="state-icon">${Icons.serverCrash}</div>
        <h2>Gagal memuat bundle</h2>
        <p>Terjadi kesalahan koneksi. Coba muat ulang halaman.</p>
      </div>`;
    document.getElementById('itemsContainer').innerHTML = '';
  }
}
</script>

<script>
(function () {
  var CURRENT_VERSION = document.querySelector('meta[name="app-version"]').content;
  var CHECK_INTERVAL_MS = 5 * 60 * 1000; 
  var banner = null;

  function showUpdateBanner() {
    if (banner) return; 
    banner = document.createElement('div');
    banner.setAttribute('role', 'status');
    banner.style.cssText = [
      'position:fixed', 'left:50%', 'bottom:20px', 'transform:translateX(-50%)',
      'z-index:99999', 'background:var(--teal-900,#042c26)', 'color:#fff',
      'padding:12px 18px', 'border-radius:999px', 'box-shadow:0 8px 24px rgba(0,0,0,.25)',
      'display:flex', 'align-items:center', 'gap:12px', 'font-size:14px',
      'font-family:inherit', 'max-width:92vw'
    ].join(';');
    banner.innerHTML =
      '<span>Ada pembaruan tersedia.</span>' +
      '<button type="button" style="background:var(--teal,#14b8a6);color:#042c26;border:none;' +
      'padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;">Muat ulang</button>';
    banner.querySelector('button').addEventListener('click', function () {
      window.location.reload();
    });
    document.body.appendChild(banner);
  }

  function checkVersion() {
    fetch('/version.json?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (data && data.version && data.version !== CURRENT_VERSION) showUpdateBanner();
      })
      .catch(function () {});
  }

  setTimeout(checkVersion, 3000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkVersion();
  });
  setInterval(checkVersion, CHECK_INTERVAL_MS);
})();
</script>
<script src="js/theme-engine.js?v=1.4.8"></script>
